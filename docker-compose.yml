services:
  postgres:
    # Postgres 18 with the pgvector extension pre-installed
    image: pgvector/pgvector:pg18
    container_name: ai_banking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_banking
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_banking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
